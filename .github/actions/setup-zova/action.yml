name: Setup pinned Zova SDK
description: Fetch and build the exact Zova SDK used by Zova-CBM

inputs:
  target:
    description: Optional Zig target triple for the Zova static library
    required: false
    default: ''
  cpu:
    description: Optional Zig CPU model/features for portable shared artifacts
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.17.0

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: ata-sesli/zova
        ref: 23a75306d6c9ff44a6bdf24c8120b302439ce726
        path: .ci/zova
        persist-credentials: false

    - name: Restore pinned Zova build
      id: zova-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .ci/zova/zig-out
          ${{ runner.temp }}/zova-cache
          ${{ runner.temp }}/zig-global-cache
        key: zova-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.cpu }}-zig-0.17.0-23a75306d6c9ff44a6bdf24c8120b302439ce726

    - name: Build pinned Zova
      if: steps.zova-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/.ci/zova
      env:
        TARGET: ${{ inputs.target }}
        CPU: ${{ inputs.cpu }}
      run: |
        set -euo pipefail
        CACHE_ROOT="$RUNNER_TEMP"
        if command -v cygpath >/dev/null 2>&1; then
          CACHE_ROOT=$(cygpath -m "$CACHE_ROOT")
        fi
        BUILD_ARGS=(c-abi
          --cache-dir "$CACHE_ROOT/zova-cache"
          -Doptimize=ReleaseSafe)
        [[ -z "$TARGET" ]] || BUILD_ARGS+=(-Dtarget="$TARGET")
        [[ -z "$CPU" ]] || BUILD_ARGS+=(-Dcpu="$CPU")
        ZIG_GLOBAL_CACHE_DIR="$CACHE_ROOT/zig-global-cache" zig build "${BUILD_ARGS[@]}"

    - name: Normalize Windows archive name
      shell: bash
      working-directory: ${{ github.workspace }}/.ci/zova
      run: |
        set -euo pipefail
        if [[ -f zig-out/lib/zova_c.lib && ! -f zig-out/lib/libzova_c.a ]]; then
          cp zig-out/lib/zova_c.lib zig-out/lib/libzova_c.a
        fi

    - name: Verify pinned Zova
      shell: bash
      env:
        EXPECTED_COMMIT: 23a75306d6c9ff44a6bdf24c8120b302439ce726
      run: |
        set -euo pipefail
        ZOVA_ROOT="$GITHUB_WORKSPACE/.ci/zova"
        test "$(git -C "$ZOVA_ROOT" rev-parse HEAD)" = "$EXPECTED_COMMIT"
        test -f "$ZOVA_ROOT/zig-out/lib/libzova_c.a"
        grep -q 'Zova C ABI, v1.4.0' "$ZOVA_ROOT/include/zova.h"
        {
          echo "ZOVA_ROOT=$ZOVA_ROOT"
          echo "CBM_ZOVA_PIN_ROOT=$ZOVA_ROOT"
        } >> "$GITHUB_ENV"
